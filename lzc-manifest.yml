application:
  subdomain: syncthing
  # The previous LPK used user_app: true. Keep per-user instances and appvar.
  multi_instance: true
  # The GUI stays behind LazyCat HTTP authentication. Only peer traffic uses L4.
  routes:
    - /=http://syncthing:8384
  ingress:
    - protocol: tcp
      description: Syncthing peer synchronization
      service: syncthing
      port: 22000

services:
  syncthing:
    # The executor replaces this store baseline with the selected official copy.
    image: registry.lazycat.cloud/medium/rich_lzc/syncthing:9e16f9addfc43caf
    environment:
      # The legacy container used UID 0 and the image's default GID 1000.
      # Preserve access to existing keys and files with restricted permissions.
      PUID: '0'
      PGID: '1000'
    binds:
      - /lzcapp/var/conf:/var/syncthing
    healthcheck:
      test: [CMD, curl, -fsS, --max-time, '3', 'http://127.0.0.1:8384/rest/noauth/health']
      interval: 20s
      timeout: 5s
      retries: 5
